name: wes-pipeline
channels:
  - bioconda
  - conda-forge
  - defaults

dependencies:
  # SRA tools
  - sra-tools=3.0.10

  # Alignment
  - bwa=0.7.17
  - samtools=1.19.2

  # QC
  - fastqc=0.12.1
  - multiqc=1.21
  - fastp=0.23.4

  # Variant calling & BQSR
  - gatk4=4.5.0.0

  # Picard (included in gatk4 or standalone)
  - picard=3.1.1

  # Variant annotation
  - ensembl-vep=111.0

  # Workflow manager
  - snakemake=8.5.3
  - snakemake-executor-plugin-cluster-generic=1.0.7

  # Reference genome download
  - ncbi-datasets-cli=16.12.0

  # Python utilities
  - python=3.11
  - pandas=2.2.1
  - numpy=1.26.4
  - pyyaml=6.0.1

  # Misc
  - pigz=2.8          # parallel gzip for FASTQ compression
  - samblaster=0.1.26 # optional duplicate marking alternative
  - bedtools=2.31.1   # BED file manipulation
